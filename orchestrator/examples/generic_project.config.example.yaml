dry_run: true
loop_budget: 1

loop:
  max_iterations: 3
  allow_remediation: false

project:
  name: generic_project
  adapter: generic_csv
  root: /path/to/repo
  state_file: PROJECT_STATE.md
  registry_file: data/task_registry.csv
  review_manifest: output/review_manifest.json
  default_labels:
    - agent-task

github:
  owner: example-owner
  repo: example-repo
  base_branch: main
  token_env: GITHUB_TOKEN

executor:
  kind: noop
  dry_run: true

reviewer:
  kind: noop
  dry_run: true

supervisor:
  kind: noop
  dry_run: true
